[workspace]
resolver = "2"
members = [
    "crates/pilotdroid-adb",
    "crates/pilotdroid-cli",
    "crates/pilotdroid-agent",
    "crates/pilotdroid-proto",
]

[workspace.package]
edition = "2021"
version = "0.8.0"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/mofanx/pilotdroid"
homepage = "https://github.com/mofanx/pilotdroid"
readme = "README.md"
keywords = ["android", "adb", "uiautomator", "automation", "mcp"]

[workspace.dependencies]
pilotdroid-adb = { path = "crates/pilotdroid-adb" }
pilotdroid-agent = { path = "crates/pilotdroid-agent" }
pilotdroid-proto = { path = "crates/pilotdroid-proto" }
