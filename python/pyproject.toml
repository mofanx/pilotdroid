[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotdroid"
version = "0.10.0"
description = "Device-side UiAutomation agent — uiautomator2-compatible Python client (connect/click/query/scroll/stream)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["msgpack>=1.0"]

[project.scripts]
pilotdroid-agent = "pilotdroid.agent_client:main"
pilotdroid-cli = "pilotdroid.cli_bootstrap:main"
# `uvx pilotdroid ...` resolves an entry named like the package — required
# for the MCP registry pypi path (docs/mcp/server.json).
pilotdroid = "pilotdroid.cli_bootstrap:main"

[tool.setuptools]
packages = ["pilotdroid"]
include-package-data = false
