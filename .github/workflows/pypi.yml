name: pypi

# Publishes the `pilotdroid` package to PyPI when a GitHub Release is
# PUBLISHED (i.e. the draft produced by release.yml has been reviewed and
# shipped). Uses OIDC trusted publishing — no API token in the repo.
#
# One-time PyPI setup (project must exist or be created as "pending"):
#   PyPI → pilotdroid → Publishing → add a trusted publisher:
#     owner: mofanx · repo: pilotdroid · workflow: pypi.yml · env: pypi
# Fallback (if OIDC is unavailable): store a scoped API token as the
# PYPI_API_TOKEN repo secret and replace the publish step's `with:` block
# with `password: ${{ secrets.PYPI_API_TOKEN }}`.

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: build dists
        run: |
          python -m pip install --upgrade pip build
          (cd python && python -m build --outdir ../dist)

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
