name: release

# Tag-triggered (v*) packaging. Produces a DRAFT GitHub Release — a human
# reviews the notes and presses "Publish release" (which then fires pypi.yml).
# workflow_dispatch runs the same build matrix WITHOUT creating a release —
# use it to smoke-test packaging after workflow changes.
#
# Artifacts (per tag release):
#   - pilotdroid-cli-linux-x86_64   (cargo build --release, ubuntu-latest)
#   - pilotdroid-cli-macos-arm64    (cargo build --release, macos-latest)
#   - pilotdroid-cli-windows-x86_64 (cargo build --release, windows-latest;
#                                  libusb builds vendored via adb_client)
#   - agent.jar                     (committed dex — same bytes embedded in the
#                                  CLI via include_bytes!, so no SDK needed)
#   - pilotdroid-*.whl + .tar.gz    (python/ sdist+wheel, u2 shim + client)
#   - SHA256SUMS.txt

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag must match workspace + python version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wv=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          pv=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag workspace=$wv python=$pv"
          [ "$tag" = "$wv" ] || { echo "::error::tag $tag != workspace version $wv"; exit 1; }
          [ "$pv" = "$wv" ] || { echo "::error::python version $pv != workspace version $wv"; exit 1; }

  cli:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux-x86_64, bin: pilotdroid-cli }
          - { os: macos-latest, suffix: macos-arm64, bin: pilotdroid-cli }
          - { os: windows-latest, suffix: windows-x86_64, bin: pilotdroid-cli.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build CLI (release)
        run: cargo build --release -p pilotdroid-cli

      - name: stage + upload
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/pilotdroid-cli-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.suffix }}
          path: dist/

  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build dists
        run: |
          python -m pip install --upgrade pip build
          (cd python && python -m build --outdir ../dist)
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  release:
    if: github.event_name == 'push'
    needs: [verify-tag, cli, python-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: stage jar + checksums
        run: |
          cp agent/agent.jar dist/agent.jar
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist/
      - name: create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
