name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        # NOTE(boundary): unit/protocol tests only. Do NOT add
        # android-emulator-runner jobs that assert device capabilities —
        # emulators are adb-root/permissive and their /dev/input, SELinux and
        # input-injection behavior does NOT transfer to retail devices.
        # Emulators may only validate protocol framing and the API-level
        # InputManager/InputManagerGlobal boundary; every capability-matrix
        # conclusion (docs/04-capability-matrix.md) must come from real
        # hardware via spike/scripts.
        run: cargo test --workspace

      - name: docs-smoke (README copy-paste surface regression)
        # mcpServers block parses, binary exists, `serve --help` documents
        # --device, every inline `pilotdroid-cli <sub>` in README is real.
        run: |
          cargo build -p pilotdroid-cli
          python3 spike/e2e/docs-smoke.py

  agent-jar-sync:
    # agent/agent.jar is committed AND embedded via include_bytes! — it must
    # be rebuilt + recommitted whenever agent/java/** changes. Guard: the
    # jar's last commit must not be older than the java sources' last commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: agent.jar must not be stale vs agent/java/**
        run: |
          java_ts=$(git log -1 --format=%ct -- agent/java)
          jar_ts=$(git log -1 --format=%ct -- agent/agent.jar)
          java_sha=$(git log -1 --format=%h -- agent/java)
          jar_sha=$(git log -1 --format=%h -- agent/agent.jar)
          echo "java last-change: $java_sha ($java_ts) | jar last-commit: $jar_sha ($jar_ts)"
          if [ "$jar_ts" -lt "$java_ts" ]; then
            echo "::error::agent/agent.jar is older than agent/java/** — rebuild with agent/scripts/deploy-agent.sh <serial> and 'git add agent/agent.jar'"
            exit 1
          fi

  agent-jar-repro:
    # Byte-level provenance: rebuild agent.jar from source and compare with
    # the committed artifact (upgrades jar-sync from commit-ordering to
    # byte-identity). Repro requires the SAME inputs as the local build:
    # android-34 platform jar + build-tools d8 (pinned 37.0.0) + javac
    # --release 8 + d8 --min-api 30. d8 output is deterministic (zip
    # entries carry epoch timestamps).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install android-34 platform + build-tools 37.0.0
        # ubuntu-latest runners ship a preinstalled Android SDK at
        # $ANDROID_HOME — call its sdkmanager directly. (setup-android@v3
        # breaks: its default `packages: tools platform-tools` requests the
        # removed legacy `tools` package.)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;37.0.0"
      - name: rebuild agent.jar
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p /tmp/jarrepro/build
          javac --release 8 -classpath "$SDK/platforms/android-34/android.jar" \
            -d /tmp/jarrepro/build agent/java/pilotdroid/Agent.java
          "$SDK/build-tools/37.0.0/d8" --min-api 30 \
            --output /tmp/jarrepro/agent.jar /tmp/jarrepro/build/pilotdroid/Agent*.class
          sha256sum agent/agent.jar /tmp/jarrepro/agent.jar
      - name: committed jar must be byte-identical
        run: |
          if cmp -s agent/agent.jar /tmp/jarrepro/agent.jar; then
            echo "REPRODUCIBLE: committed jar == rebuilt jar (byte-identical)"
          else
            echo "::error::agent.jar diverges from source rebuild — dex provenance unverifiable. See RESULTS-M14 for the divergence analysis."
            sha256sum agent/agent.jar /tmp/jarrepro/agent.jar
            unzip -l agent/agent.jar; unzip -l /tmp/jarrepro/agent.jar
            exit 1
          fi

  python:
    # u2 shim + protocol client: no pytest suite yet — syntax-compile every
    # shipped script, editable-install the package, and smoke the imports /
    # console entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: compileall
        run: python -m compileall -q python compat agent/scripts spike

      - name: pip install + import smoke
        run: |
          pip install -e ./python
          python -c "import pilotdroid, pilotdroid.u2shim, pilotdroid.agent_client"
          command -v pilotdroid-agent

      - name: doc-drift (README tool count ↔ serve.rs, shim methods ↔ SUPPORTED.md)
        run: python3 spike/e2e/doc-drift.py

  # Byte-repro of the agent dex build is covered by agent-jar-repro above
  # (runner SDK platform jar + pinned build-tools d8).
